[project]
name = "einstein"
version = "0.0.1"
description = "Systematic search for aperiodic monotiles (see docs/program/)"
requires-python = ">=3.12"
dependencies = [
    "python-sat",  # CaDiCaL backend for A3 (D-0009)
    "numpy",       # A4 spectral analysis only (D-0010)
    "sympy==1.14.0",  # exact Smith forms for W2 Layer C (D-0032)
    "python-flint==0.9.0",  # compiled production Smith backend (D-0032)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running validation tests (run explicitly with -m slow)"]
addopts = "-m 'not slow'"
