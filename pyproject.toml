[project]
name = "einstein"
version = "0.0.1"
description = "Systematic search for aperiodic monotiles (see docs/program/)"
requires-python = ">=3.12"
dependencies = [
    "python-sat",  # CaDiCaL backend for A3 (D-0009)
    "numpy",       # A4 spectral analysis only (D-0010)
    "sympy==1.14.0",  # exact Smith forms for W2 Layer C (D-0032)
    "python-flint==0.9.0",  # compiled production Smith backend (D-0032)
    "highspy==1.15.1",  # Layer-D LP/MIP discovery and rational-dual search
    "networkx==3.6.1",  # finite conflict-graph clique enumeration probes
    "scipy==1.18.0",  # small continuous masters paired with HiGHS MIP probes
    "z3-solver==5.0.0.0",  # exact QF_NRA decision for K16W (D-0148)
    "cvc5==1.3.4",  # HC-38 tangent-stratum cylindrical algebraic coverings
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running validation tests (run explicitly with -m slow)",
    "tier_unit: fast tests for reusable exact primitives",
    "tier_certificate: cold verification of retained certificates and source reconstructions",
    "tier_control: known-system and historical-pipeline controls",
    "tier_provenance: governance, literature, catalog and external-anchor integrity",
]
addopts = "--import-mode=importlib -m 'not slow'"
